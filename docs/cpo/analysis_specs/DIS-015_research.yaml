feature_id: "DIS-015"
research_findings:
  libraries:
    backend:
      - name: "FastAPI-Users / Authlib"
        use_case: "Implementing RBAC (Role-Based Access Control) and secure token generation for shareable links."
    frontend:
      - name: "ant-design Modal/List"
        use_case: "UI for managing collaborator lists and permission levels (Viewer/Editor)."
  competitors:
    celonis:
      approach: "Process Workspaces act as collaboration hubs. Sharing an 'Insight' automatically manages permissions for the recipient."
      features: ["Email notifications with direct links", "External sharing approval workflows", "PDF reports with live links"]
    signavio:
      approach: "Collaboration Hub as the single source of truth. Supports commenting licenses for external stakeholders."
      features: ["Simplified curated views for non-experts", "Approval workflows for publishing", "Activity feed/Comments"]
  ux_patterns:
    - pattern: "Invite Collaborators"
      application: "A standard sharing modal where users can enter emails and assign 'Can View' or 'Can Edit' permissions."
    - pattern: "Secure Public Link"
      application: "Generating a random, high-entropy token link that allows read-only access without login (with optional password/expiry)."
    - pattern: "Collaboration Comments"
      application: "Sticky notes or comments anchored to specific activities or edges on the process map to facilitate asynchronous discussion."
  optimizations:
    - technique: "Row-Level Security (RLS)"
      benefit: "Ensure that shared links only reveal data subsets the sharer is authorized to see, preventing accidental data leaks in multi-tenant environments."
    - technique: "Snapshotting for Sharing"
      benefit: "When sharing a 'fixed' result, save a static snapshot of the discovery state to ensure the viewer sees exactly what the sharer saw, even if the underlying data changes."
  recommendations:
    must_have: ["RBAC (Viewer/Analyst/Admin)", "Secure link sharing", "Internal team sharing", "Email notifications"]
    nice_to_have: ["Commenting on Map", "Public link with expiry", "Slack/Teams integration"]
    avoid: ["Don't allow public sharing by default for sensitive datasets; require admin approval or MFA", "Avoid sharing 'live' filters that might change; prefer immutable snapshots for 'Insights'"]
