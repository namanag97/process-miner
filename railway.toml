# ===========================================
# Railway Deployment Config (FREE tier available)
# ===========================================
# This file tells Railway how to build and run the backend

[build]
builder = "nixpacks"

[deploy]
startCommand = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/api/health"
healthcheckTimeout = 100

[[services]]
name = "process-miner-api"
