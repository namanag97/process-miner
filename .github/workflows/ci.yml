name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  # Backend Tests
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: backend
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run tests
        run: |
          PYTHONPATH=. pytest tests/ -v --tb=short
        env:
          DEBUG: 'true'
      
      - name: Check imports
        run: |
          python -c "from app.main import app; print('✅ Import check passed')"

  # Frontend Lint & Build
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint check
        run: npm run lint
      
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # Docker Build Check
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: docker build -t process-miner-backend -f Dockerfile.backend .
      
      - name: Build frontend image
        run: docker build -t process-miner-frontend -f Dockerfile.frontend .
      
      - name: Test backend container starts
        run: |
          docker run -d --name backend-test -p 8000:8000 process-miner-backend
          sleep 5
          curl -f http://localhost:8000/api/health || exit 1
          docker stop backend-test
