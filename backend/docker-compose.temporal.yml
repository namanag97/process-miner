version: "3.8"

# =============================================================================
# Temporal Development Stack
# =============================================================================
# Local development environment for Temporal workflow orchestration.
# 
# Usage:
#   docker-compose -f docker-compose.temporal.yml up -d
#
# Services:
#   - temporal: Temporal server (auto-setup with dev mode)
#   - temporal-ui: Web UI at http://localhost:8088
#   - temporal-admin-tools: CLI tools for administration
#
# Note: Uses SQLite for persistence in dev mode (sufficient for local MVP)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Temporal Server (Dev Mode)
  # ---------------------------------------------------------------------------
  temporal:
    container_name: temporal
    image: temporalio/auto-setup:1.24.2
    ports:
      - "7233:7233"  # gRPC API
    environment:
      - DB=sqlite
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development.yaml
    volumes:
      - temporal_data:/var/lib/temporal/data
      - ./temporal-config:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - process-mining-net

  # ---------------------------------------------------------------------------
  # Temporal Web UI
  # ---------------------------------------------------------------------------
  temporal-ui:
    container_name: temporal-ui
    image: temporalio/ui:2.26.2
    ports:
      - "8088:8080"  # Web UI
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - process-mining-net

  # ---------------------------------------------------------------------------
  # Temporal Admin Tools (CLI)
  # ---------------------------------------------------------------------------
  temporal-admin-tools:
    container_name: temporal-admin-tools
    image: temporalio/admin-tools:latest
    stdin_open: true
    tty: true
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - process-mining-net

volumes:
  temporal_data:
    driver: local

networks:
  process-mining-net:
    driver: bridge
