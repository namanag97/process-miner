[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process-mining-saas"
version = "0.1.0"
description = "Process Mining SaaS - Local Development"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Developer" }]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Process Mining
    "pm4py>=2.7.0",

    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",

    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",

    # Authentication (Mock)
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",

    # File Handling
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",

    # Utilities
    "httpx>=0.26.0",
    "python-dateutil>=2.8.0",

    # Logging
    "structlog>=24.1.0",
    "asgi-correlation-id>=4.3.0",

    # Infrastructure (Async Tasks & Caching)
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "flower>=2.0.0",

    # ML & Analytics
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "networkx>=3.2",

    # High-Performance Data Processing (OCEL 2.0 / Vectorized Ingestion)
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    # Type checking
    "mypy>=1.8.0",
    "types-python-dateutil>=2.8.0",
    # Security scanning
    "bandit>=1.7.0",
    "safety>=3.0.0",
    # Dead code detection
    "vulture>=2.11",
    # Pre-commit hooks
    "pre-commit>=3.6.0",
]

observability = [
    # Prometheus metrics
    "prometheus-client>=0.19.0",
    # OpenTelemetry
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-exporter-otlp>=1.22.0",
]

all = [
    "process-mining-saas[dev,observability]",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, variables, etc.)
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting/organization)
    "B",    # flake8-bugbear (common bugs and design problems)
    "C4",   # flake8-comprehensions (better list/dict comprehensions)
    "SIM",  # flake8-simplify (simplify code patterns)
    "UP",   # pyupgrade (upgrade syntax for newer Python)
    "RUF",  # ruff-specific rules
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie (misc lints)
    "T20",  # flake8-print (no print statements)
    "RET",  # flake8-return (return statement issues)
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (needed for FastAPI Depends)
    "B904",   # raise without from - common pattern in FastAPI exception handlers
    "ARG001", # unused function argument (common in abstract methods)
    "ARG002", # unused method argument (common in abstract/interface methods)
    "SIM102", # nested if suggestion (sometimes clearer to keep separate)
    "SIM105", # contextlib.suppress suggestion (explicit try/except clearer)
    "SIM108", # ternary suggestion (sometimes clearer to use if/else)
    "F821",   # undefined name - false positives on forward references in TYPE_CHECKING
    "RUF006", # store task reference - intentional fire-and-forget for logging
    "RUF012", # mutable class attrs (intentional in test fixtures)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20", "ARG"]  # Allow print and unused args in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
]

# Per-module overrides for service layer with heavy PM4py dynamic patterns
[[tool.mypy.overrides]]
module = [
    "src.services.analytics",
    "src.services.mining",
    "src.services.llm",
    "src.services.conformance",
    "src.services.ocpm",
    "src.services.ingestion",
    "src.services.organizational",
    "src.services.simulation",
    "src.services.prediction",
    "src.services.filtering",
    "src.services.unified_ingestion",
    "src.infrastructure.tasks",
    "src.infrastructure.cache",
    "src.infrastructure.devconsole_exporter",
    "src.infrastructure.retry",
    "src.infrastructure.circuit_breaker",
    "src.infrastructure.tracing",
    "src.infrastructure.log_broker",
    "src.infrastructure.rate_limiter",
    "src.infrastructure.duckdb",
    "src.engine.miners",
    "src.domain.entities",
    "src.core.etag",
    "src.core.exceptions",
    "src.core.idempotency",
    "src.core.middleware",
    "src.core.logging_config",
    "src.core.domain_events",
    "src.api.routers.dev_logs_stream",
    "src.api.routers.datasets",
    "src.api.routers.telemetry_proxy",
    "src.api.routers.ocpm",
    "src.core.value_objects",
    "src.services.analysis_registry",
    "src.services.recommendation",
    "src.models.repositories",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # Skip assert warnings in tests

# =============================================================================
# Import Linter - Clean Architecture Enforcement
# =============================================================================
# Architecture Layers (Hexagonal/Ports-and-Adapters pattern):
#   domain       → Pure business logic, entities, value objects (NO external deps)
#   services     → Use cases, orchestrates domain + infrastructure
#   infrastructure → DB, external APIs, messaging, resilience patterns
#   api          → API routers, DTOs (depends on all layers)
#
# Key constraints:
#   - Domain must be pure (no infrastructure/api dependencies)
#   - Services cannot depend on API (presentation layer)
#   - API is the outermost layer
# =============================================================================

[tool.importlinter]
root_package = "src"
include_external_packages = true

# Contract 1: Domain layer must be pure (no infrastructure or API dependencies)
[[tool.importlinter.contracts]]
name = "Domain Independence"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = [
    "src.infrastructure",
    "src.api",
    "sqlalchemy",
    "fastapi",
    "httpx",
]

# Contract 2: Services layer cannot depend on API/presentation
[[tool.importlinter.contracts]]
name = "Services Independence from API"
type = "forbidden"
source_modules = ["src.services"]
forbidden_modules = ["src.api"]

# Contract 3: Infrastructure cannot depend on API
[[tool.importlinter.contracts]]
name = "Infrastructure Independence from API"
type = "forbidden"
source_modules = ["src.infrastructure"]
forbidden_modules = ["src.api"]

