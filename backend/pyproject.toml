[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process-mining-saas"
version = "0.1.0"
description = "Process Mining SaaS - Local Development"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Developer" }]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    
    # Process Mining
    "pm4py>=2.7.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",
    
    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    
    # Authentication (Mock)
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    
    # File Handling
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",
    
    # Utilities
    "httpx>=0.26.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    # Type checking
    "mypy>=1.8.0",
    "types-python-dateutil>=2.8.0",
    # Security scanning
    "bandit>=1.7.0",
    # Pre-commit hooks
    "pre-commit>=3.6.0",
]

observability = [
    # Prometheus metrics
    "prometheus-client>=0.19.0",
    # OpenTelemetry
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-exporter-otlp>=1.22.0",
]

all = [
    "process-mining-saas[dev,observability]",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # Skip assert warnings in tests

# =============================================================================
# Import Linter - Clean Architecture Enforcement
# =============================================================================
# Architecture Layers (inner → outer, dependencies flow outward only):
#   domain       → Pure business logic, entities, value objects (NO external deps)
#   application  → Use cases, services (depends on domain)
#   infrastructure → DB, external APIs, messaging (depends on domain, application)  
#   presentation → API routers, DTOs (depends on all layers)
# =============================================================================

[tool.importlinter]
root_package = "src"
include_external_packages = false

# Contract 1: Layered Architecture - Dependencies must flow outward
[[tool.importlinter.contracts]]
name = "Layered Architecture"
type = "layers"
layers = [
    "src.presentation",
    "src.infrastructure", 
    "src.application",
    "src.domain",
]
# Outer layers can import from inner layers, but not vice versa

# Contract 2: Domain layer must be pure (no infrastructure dependencies)
[[tool.importlinter.contracts]]
name = "Domain Independence"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = [
    "src.infrastructure",
    "src.presentation",
    "sqlalchemy",
    "fastapi",
    "httpx",
]

# Contract 3: Application layer cannot depend on presentation
[[tool.importlinter.contracts]]
name = "Application Independence from Presentation"
type = "forbidden"
source_modules = ["src.application"]
forbidden_modules = ["src.presentation"]
