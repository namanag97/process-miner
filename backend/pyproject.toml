[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "process-mining-saas"
version = "0.1.0"
description = "Process Mining SaaS - Local Development"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Developer" }]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "slowapi>=0.1.9",

    # Process Mining
    "pm4py>=2.7.0",

    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0.0",

    # Data Validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",

    # Authentication (Mock)
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",

    # File Handling
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.0",

    # Utilities
    "httpx>=0.26.0",
    "python-dateutil>=2.8.0",

    # Logging & Observability
    "structlog>=24.1.0",
    "asgi-correlation-id>=4.3.0",
    "psutil>=5.9.0",  # System metrics for DevConsole

    # Infrastructure (Async Tasks & Caching)
    "celery[redis]>=5.3.0",
    "redis>=5.0.0",
    "flower>=2.0.0",

    # ML & Analytics
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "networkx>=3.2",
    "joblib>=1.3.0",  # ML model serialization (safer than pickle)
    "msgpack>=1.0.0",  # Fast binary serialization for caching

    # High-Performance Data Processing (OCEL 2.0 / Vectorized Ingestion)
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",

    # Object Storage (S3/MinIO)
    "boto3>=1.34.0",

    # Workflow Orchestration (Temporal)
    "temporalio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    # Testing - AWS mocks
    "moto[s3]>=5.0.0",
    # Type checking
    "mypy>=1.8.0",
    "types-python-dateutil>=2.8.0",
    # Security scanning
    "bandit>=1.7.0",
    "safety>=3.0.0",
    # Dead code detection
    "vulture>=2.11",
    # Pre-commit hooks
    "pre-commit>=3.6.0",
]

# Observability dependencies removed - using simple DevConsole + structlog instead

all = [
    "process-mining-saas[dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (DB, external services)",
    "e2e: End-to-end tests (full workflow)",
    "slow: Slow tests (>5s)",
]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pm4py.*:",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/__pycache__/*", "*/.venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
fail_under = 30
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (unused imports, variables, etc.)
    "W",    # pycodestyle warnings
    "I",    # isort (import sorting/organization)
    "B",    # flake8-bugbear (common bugs and design problems)
    "C4",   # flake8-comprehensions (better list/dict comprehensions)
    "SIM",  # flake8-simplify (simplify code patterns)
    "UP",   # pyupgrade (upgrade syntax for newer Python)
    "RUF",  # ruff-specific rules
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie (misc lints)
    "T20",  # flake8-print (no print statements)
    "RET",  # flake8-return (return statement issues)
    "ARG",  # flake8-unused-arguments
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (needed for FastAPI Depends)
    "B904",   # raise without from - common pattern in FastAPI exception handlers
    "ARG001", # unused function argument (common in abstract methods)
    "ARG002", # unused method argument (common in abstract/interface methods)
    "SIM102", # nested if suggestion (sometimes clearer to keep separate)
    "SIM105", # contextlib.suppress suggestion (explicit try/except clearer)
    "SIM108", # ternary suggestion (sometimes clearer to use if/else)
    "F821",   # undefined name - false positives on forward references in TYPE_CHECKING
    "RUF006", # store task reference - intentional fire-and-forget for logging
    "RUF012", # mutable class attrs (intentional in test fixtures)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20", "ARG"]  # Allow print and unused args in tests

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "tests/",
    ".venv/",
]

# Per-module overrides for feature layer with heavy PM4py dynamic patterns
[[tool.mypy.overrides]]
module = [
    "src.features.process_mining.discovery.*",
    "src.features.process_mining.analytics.*",
    "src.features.process_mining.conformance.*",
    "src.features.process_mining.organizational.*",
    "src.features.process_mining.simulation.*",
    "src.features.process_mining.predictions.*",
    "src.features.process_mining.ingestion.*",
    "src.features.process_mining.ocpm.*",
    "src.features.process_mining.filtering.*",
    "src.features.process_mining.datasets.*",
    "src.features.process_mining.services.*",
    "src.features.process_mining.models.*",
    "src.features.process_mining.schemas.*",
    "src.features.process_mining.api.*",
    "src.features.process_mining.statistics.*",
    "src.features.process_mining.visualization.*",
    "src.features.process_mining.business_use_cases.*",
    "src.infra.infrastructure.*",
    "src.infra.temporal.*",
    "src.infra.dag.*",
    "src.infra.workflows.*",
    "src.shared.*",
    "src.scripts.*",
    "src.domain.*",
]
ignore_errors = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # Skip assert warnings in tests

# =============================================================================
# Import Linter - Clean Architecture Enforcement
# =============================================================================
# Architecture Layers (Hexagonal/Ports-and-Adapters pattern):
#   domain       → Pure business logic, entities, value objects (NO external deps)
#   services     → Use cases, orchestrates domain + infrastructure
#   infrastructure → DB, external APIs, messaging, resilience patterns
#   api          → API routers, DTOs (depends on all layers)
#
# Key constraints:
#   - Domain must be pure (no infrastructure/api dependencies)
#   - Services cannot depend on API (presentation layer)
#   - API is the outermost layer
# =============================================================================

[tool.importlinter]
root_package = "src"
include_external_packages = true

# Note: Contracts for src.domain and src.services removed - these modules don't exist
# The architecture is currently organized as:
# - src.features (process mining business logic)
# - src.infra (generic SaaS infrastructure)
# - src.api (presentation layer)
# - src.application (CQRS commands/queries)

# Contract 3: Infrastructure cannot depend on API
# Note: src.infrastructure is a deprecated shim that re-exports from src.infra.infrastructure
# The actual contract is enforced on the platform layer, not this shim
# Disabled: This contract creates false positives due to transitive imports through the shim
# [[tool.importlinter.contracts]]
# name = "Infrastructure Independence from API"
# type = "forbidden"
# source_modules = ["src.infrastructure"]
# forbidden_modules = ["src.api"]

# =============================================================================
# Platform/Feature Layer Separation (SaaS Architecture)
# =============================================================================
# Platform Layer: Generic SaaS infrastructure (auth, workspaces, storage, etc.)
# Feature Layer: Domain-specific business logic (process mining)
#
# Key constraint: Platform MUST NEVER depend on Features (enables vertical pivots)
# =============================================================================

# Contract 4: Platform CORE layer cannot depend on Features
# Note: Platform infrastructure (tasks, repositories) CAN use src.models.orm for orchestration
# This is intentional - tasks need to operate on all model types
[[tool.importlinter.contracts]]
name = "Platform Core Independence from Features"
type = "forbidden"
source_modules = ["src.infra.core"]
forbidden_modules = ["src.features", "src.models.orm"]
ignore_imports = [
    # TODO: Technical debt - remove this shim file and update all imports
    # to use src.features.process_mining.enums directly
    "src.infra.core.enums -> src.features.process_mining.enums",
]

# Contract 5: Platform core cannot depend on platform services
[[tool.importlinter.contracts]]
name = "Platform Core Independence"
type = "forbidden"
source_modules = ["src.infra.core"]
forbidden_modules = ["src.infra.auth", "src.infra.users", "src.infra.workspaces", "src.infra.projects", "src.infra.infrastructure"]

# =============================================================================
# Anti-Duplication Contracts - Enforce Canonical Import Paths
# =============================================================================
# These contracts prevent imports from deprecated/duplicate code paths.
# Canonical paths:
#   - Models: src.features.process_mining.models
#   - Datasets API: src.features.process_mining.datasets.api
#   - Ingestion: src.features.process_mining.ingestion
# =============================================================================

# Contract 6: Forbid imports from deprecated api/datasets path (deleted)
[[tool.importlinter.contracts]]
name = "No Deprecated API Datasets Path"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["src.features.process_mining.api.datasets"]

# Contract 7: Forbid imports from deprecated datasets/models path (deleted)
[[tool.importlinter.contracts]]
name = "No Deprecated Datasets Models Path"
type = "forbidden"
source_modules = ["src"]
forbidden_modules = ["src.features.process_mining.datasets.models"]

# Note: Ingestion shim contracts removed due to import-linter "shared descendants" limitation.
# The custom script (scripts/check_canonical_imports.py) validates canonical import paths instead.
# Shim modules are scheduled for removal after all external imports are migrated.

